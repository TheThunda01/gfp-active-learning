name: GFP uncertainty ablation
on: [push, pull_request]
permissions:
  contents: read
jobs:
  ablation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest discover -s experiments/uncertainty_ablation/tests -v
      - run: python -m experiments.uncertainty_ablation --output-dir /tmp/gfp-uncertainty-ablation
      - name: Reconstruct the first shortlist
        run: |
          python -c "import platform, numpy, sklearn; print(platform.platform(), platform.machine(), platform.python_version(), numpy.__version__, sklearn.__version__)"
          python -m experiments.shortlist_review.audit --output /tmp/gfp-first-shortlist.csv
          cat /tmp/gfp-first-shortlist.csv
